name: Publicar release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  desktop:
    name: Publicar instalador Windows NSIS
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verificar que el tag coincide con package.json
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (tag?.replace(/^v/, '') !== version) {
            console.error(`El tag ${tag} no coincide con la versión ${version} de package.json.`);
            process.exit(1);
          }
          NODE
      - name: Instalar dependencias
        run: npm ci
      - name: Generar información de versión
        run: node scripts/version-info.mjs
      - name: Generar SPA de escritorio
        run: npm run desktop:generate
      - name: Publicar instalador en GitHub Releases
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

