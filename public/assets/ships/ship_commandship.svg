<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80">
  <defs>
    <radialGradient id="g" cx="0" cy="0" r="38">
      <stop offset="0%" stop-color="#b06bff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b06bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="0" cy="0" r="38" fill="url(#g)"/>
  <!-- Casco principal: acorazado alargado con proa afilada -->
  <polygon points="38,0 24,-8 6,-14 -18,-16 -32,-10 -36,0 -32,10 -18,16 6,14 24,8"
           fill="#3a2456" opacity="0.95" stroke="#b06bff" stroke-width="1.4"/>
  <!-- Espina dorsal luminosa -->
  <line x1="-30" y1="0" x2="30" y2="0" stroke="#d24aff" stroke-width="1.6" opacity="0.8"/>
  <!-- Alas laterales blindadas -->
  <polygon points="-4,-14 10,-24 -14,-28 -24,-16" fill="#4c2f70" stroke="#b06bff" stroke-width="1"/>
  <polygon points="-4,14 10,24 -14,28 -24,16" fill="#4c2f70" stroke="#b06bff" stroke-width="1"/>
  <!-- Torretas láser (los múltiples cañones del jefe) -->
  <circle cx="14" cy="-9" r="3.4" fill="#d24aff" opacity="0.95"/>
  <circle cx="14" cy="9" r="3.4" fill="#d24aff" opacity="0.95"/>
  <circle cx="-6" cy="-20" r="3" fill="#d24aff" opacity="0.9"/>
  <circle cx="-6" cy="20" r="3" fill="#d24aff" opacity="0.9"/>
  <!-- Núcleo/reactor central -->
  <circle cx="-8" cy="0" r="8" fill="#241238" stroke="#d24aff" stroke-width="1.2"/>
  <circle cx="-8" cy="0" r="3.6" fill="#f0c4ff" opacity="0.95"/>
  <!-- Lanzador EMP en proa -->
  <polygon points="30,0 22,-4 22,4" fill="#66e0ff" opacity="0.9"/>
  <!-- Motores -->
  <rect x="-38" y="-6" width="5" height="4" fill="#d24aff" opacity="0.8"/>
  <rect x="-38" y="2" width="5" height="4" fill="#d24aff" opacity="0.8"/>
</svg>
